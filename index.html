<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2e"><title>球迹 · 足球地理探索</title><style>
:root{--bg:#101b2e;--panel:#18263b;--panel2:#202f45;--ink:#f3f1e8;--muted:#a2afbc;--lime:#d5ee62;--line:#34465b;--gold:#ffbd61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1240px;margin:auto;padding:0 30px}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:21px;font-weight:850;letter-spacing:.04em}.logo small{color:var(--lime);font-size:10px;letter-spacing:.2em;margin-left:10px}.top span{font-size:12px;color:var(--muted)}.hero{padding:45px 0 28px;display:flex;align-items:end;justify-content:space-between}.eyebrow{color:var(--lime);font-size:10px;letter-spacing:.2em}.hero h1{font-size:clamp(38px,6vw,70px);line-height:1.02;letter-spacing:-.06em;margin:10px 0}.hero p{color:var(--muted);margin:0}.season{border:1px solid var(--line);padding:11px 14px;border-radius:8px;background:var(--panel);color:var(--ink)}.searchbar{display:flex;gap:10px;margin:20px 0}.searchbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px;color:var(--ink);outline:0}.searchbar button,.tab{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 16px}.searchbar button:hover,.tab.active{border-color:var(--lime);color:var(--lime)}.explore{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.map{background:linear-gradient(150deg,#1e3445,#162636);border:1px solid var(--line);border-radius:12px;min-height:420px;position:relative;overflow:hidden;padding:20px}.map svg{width:100%;height:350px}.continent{fill:#56686a;stroke:#6f8181;stroke-width:1.5}.graticule{stroke:#ffffff10;fill:none}.marker{fill:var(--lime);stroke:#122033;stroke-width:4;cursor:pointer;transition:.2s}.marker:hover{r:11;fill:var(--gold)}.maplabel{font-size:11px;fill:#dbe1d6;letter-spacing:1px}.mapcaption{position:absolute;bottom:18px;left:20px;color:var(--muted);font-size:11px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.panelhead{display:flex;justify-content:space-between;align-items:start}.panel h2{margin:0;font-size:25px;letter-spacing:-.04em}.panel p{color:var(--muted);margin:5px 0 17px;font-size:13px}.tabs{display:flex;gap:8px;margin:16px 0}.clublist{display:grid;gap:9px;max-height:285px;overflow:auto}.club{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:9px;padding:11px;color:var(--ink)}.club:hover,.club.active{border-color:var(--lime)}.badge{width:40px;height:40px;border-radius:50%;background:#293d50;color:var(--lime);display:grid;place-items:center;font-size:12px;font-weight:800}.club b{font-size:14px}.club small{display:block;color:var(--muted);font-size:11px}.club strong{font-size:11px;color:var(--gold)}.detail{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;min-height:76px;color:var(--muted);font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{border:1px solid var(--line);padding:6px 10px;border-radius:99px;font-size:11px}.foot{padding:25px 0;color:var(--muted);font-size:11px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:760px){.shell{padding:0 16px}.explore{grid-template-columns:1fr}.hero{align-items:start;gap:15px;flex-direction:column}.map{min-height:330px}.map svg{height:270px}.top span{display:none}}
</style></head><body><div class="shell"><header class="top"><div class="logo">球迹 <small>FIELD ATLAS</small></div><span>一张地图，很多足球故事</span></header><section class="hero"><div><div class="eyebrow">FOOTBALL · PLACE · CULTURE</div><h1>足球，从哪里开始？</h1><p>选一个国家，沿着城市和俱乐部，走进当地的足球文化。</p></div><select class="season" id="season"><option>2024 / 25 赛季</option><option>2023 / 24 赛季</option></select></section><div class="searchbar"><input id="search" placeholder="查找国家、城市或球队…"><button id="random">带我去一个地方 ↗</button></div><main class="explore"><section class="map"><svg viewBox="0 0 720 370" role="img" aria-label="足球地图示意"><path class="graticule" d="M20 185H700M360 10V350M60 110Q360 45 660 110M60 260Q360 325 660 260"/><path class="continent" d="M80 83l40-23 59 7 23 28-15 23-30 5-10 26-34-7-18-25-28-7zM184 157l27 10 17 40-10 58-22 59-18-39 5-45-16-39zM300 75l37-15 47 6 21 20 32-4 42 23-16 23-40 8-4 23-34-4-20 22-35-10-10-28-36-8-18-22zM354 180l37 2 22 40-8 54-24 59-24-24-10-57-15-38zM480 90l61-19 69 12 41 29-24 23-58-3-19 20-42-14-15-29-26-3zM563 201l32-16 43 11 20 28-22 21-37-8-29-14z"/>
<g id="markers"></g><text class="maplabel" x="95" y="52">AMERICAS</text><text class="maplabel" x="330" y="48">EUROPE</text><text class="maplabel" x="520" y="53">ASIA</text></svg><div class="mapcaption">互动地图 · 点击发光标记切换地区</div></section><section class="panel"><div class="panelhead"><div><div class="eyebrow">EXPLORE BY COUNTRY</div><h2 id="countryName">英格兰</h2></div><div class="stats"><span id="teamCount">0 支球队</span><span>俱乐部与国家队</span></div></div><div class="tabs"><button class="tab active" data-kind="club">俱乐部</button><button class="tab" data-kind="national">国家队</button></div><div class="clublist" id="clublist"></div><div class="detail" id="detail">选择一支球队，看看它所在的城市与足球故事。</div></section></main><footer class="foot">球迹 · 离线探索样本。球队资料为静态演示数据，可在此体验地图浏览和筛选。</footer></div>
<script>
const data=[{country:'英格兰',code:'ENG',x:352,y:95,clubs:[['Arsenal','伦敦','英超 · 北伦敦劲旅'],['Liverpool','利物浦','英超 · 安菲尔德主场'],['Manchester City','曼彻斯特','英超 · 伊蒂哈德主场'],['Chelsea','伦敦','英超 · 西伦敦俱乐部']],national:['英格兰国家队','三狮军团 · 温布利球场']},{country:'西班牙',code:'ESP',x:345,y:128,clubs:[['Real Madrid','马德里','西甲 · 伯纳乌球场'],['FC Barcelona','巴塞罗那','西甲 · 加泰罗尼亚代表'],['Atlético Madrid','马德里','西甲 · 大都会球场']],national:['西班牙国家队','斗牛士军团 · 欧洲冠军']},{country:'意大利',code:'ITA',x:370,y:126,clubs:[['AC Milan','米兰','意甲 · 圣西罗球场'],['Inter','米兰','意甲 · 蓝黑军团'],['Juventus','都灵','意甲 · 安联球场']],national:['意大利国家队','蓝衣军团 · 四届世界杯冠军']},{country:'德国',code:'GER',x:370,y:98,clubs:[['Bayern München','慕尼黑','德甲 · 安联球场'],['Borussia Dortmund','多特蒙德','德甲 · 黄黑主场'],['Bayer Leverkusen','勒沃库森','德甲 · 拜耳竞技场']],national:['德国国家队','日耳曼战车 · 四届世界杯冠军']},{country:'法国',code:'FRA',x:351,y:105,clubs:[['Paris Saint-Germain','巴黎','法甲 · 王子公园球场'],['Olympique Marseille','马赛','法甲 · 韦洛德罗姆球场'],['Lyon','里昂','法甲 · 里昂奥林匹克公园']],national:['法国国家队','高卢雄鸡 · 两届世界杯冠军']},{country:'巴西',code:'BRA',x:211,y:239,clubs:[['Flamengo','里约热内卢','巴甲 · 马拉卡纳主场'],['Palmeiras','圣保罗','巴甲 · 绿白军团'],['Santos','桑托斯','巴甲 · 培育传奇球星的海滨城市']],national:['巴西国家队','桑巴军团 · 五届世界杯冠军']},{country:'日本',code:'JPN',x:598,y:146,clubs:[['Kawasaki Frontale','川崎','J1 联赛 · 等等力竞技场'],['Urawa Red Diamonds','埼玉','J1 联赛 · 埼玉体育场'],['Yokohama F. Marinos','横滨','J1 联赛 · 日产体育场']],national:['日本国家队','蓝武士 · 亚洲足球代表']},{country:'阿根廷',code:'ARG',x:202,y:286,clubs:[['Boca Juniors','布宜诺斯艾利斯','阿甲 · 糖果盒球场'],['River Plate','布宜诺斯艾利斯','阿甲 · 纪念碑球场'],['Racing Club','阿韦亚内达','阿甲 · 阿根廷传统豪门']],national:['阿根廷国家队','蓝白军团 · 卫冕世界冠军']}];let current=data[0],kind='club';const $=s=>document.querySelector(s);function drawMarkers(){ $('#markers').innerHTML=data.map((d,i)=>`<circle class="marker" data-i="${i}" cx="${d.x}" cy="${d.y}" r="7"><title>${d.country}</title></circle>`).join('');document.querySelectorAll('.marker').forEach(m=>m.onclick=()=>select(data[+m.dataset.i]))}function select(d){current=d;$('#countryName').textContent=d.country;render()}function render(){let arr=kind==='club'?current.clubs.map(c=>({name:c[0],city:c[1],story:c[2]})):[{name:current.national[0],city:current.country,story:current.national[1]}];let q=$('#search').value.toLowerCase();arr=arr.filter(c=>`${c.name} ${c.city} ${c.story}`.toLowerCase().includes(q));$('#teamCount').textContent=`${arr.length} 个结果`;$('#clublist').innerHTML=arr.length?arr.map((c,i)=>`<button class="club" data-detail="${i}"><span class="badge">${c.name.slice(0,2).toUpperCase()}</span><span><b>${c.name}</b><small>${c.city} · ${c.story}</small></span><strong>查看 →</strong></button>`).join(''):'<div class="empty">没有找到球队。换个关键词试试。</div>';document.querySelectorAll('[data-detail]').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.club').forEach(x=>x.classList.remove('active'));b.classList.add('active');let c=arr[i];$('#detail').innerHTML=`<b style="color:var(--ink)">${c.name}</b> 位于 ${c.city}。<br>${c.story}。球迹把球队放回它的地理与城市文化中，沿着地图继续探索。`})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');kind=b.dataset.kind;render()});$('#search').oninput=render;$('#random').onclick=()=>select(data[Math.floor(Math.random()*data.length)]);drawMarkers();render();</script></body></html>
